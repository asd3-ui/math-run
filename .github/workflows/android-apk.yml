name: Android APK Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools, platforms;android-35, build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install npm dependencies
        run: |
          node --version
          npm --version
          npm install --no-audit --no-fund
          npm ls --depth=0
          npx cap --version

      - name: Run gameplay regression tests
        run: npm test

      - name: Build web game
        run: npm run build

      - name: Verify built web entry point
        run: |
          test -s dist/index.html
          echo "Built web output:"
          find dist -maxdepth 2 -type f | sort | head -80

      - name: Verify Capacitor configuration and Android dependency
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8')); if (!config.appId || !config.appName || config.webDir !== 'dist') process.exit(1); console.log(config)"
          npm ls @capacitor/core @capacitor/cli @capacitor/android

      - name: Generate Android project if missing
        shell: bash
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            if [ -d android ]; then
              echo "::error::The android/ directory exists but its Gradle wrapper is incomplete. Refusing to overwrite a potentially partial native project."
              find android -maxdepth 3 -type f | sort | head -100
              exit 1
            fi
            echo "Generating the native Android project using the installed Capacitor 7 dependency."
            npx cap add android
          fi

      - name: Sync Capacitor Android assets and plugins
        run: npx cap sync android

      - name: Verify Android project
        run: |
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false
        run: ./gradlew --no-daemon --stacktrace --warning-mode all clean assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          APK_PATH="$(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Gradle completed without producing a debug APK."
            find android/app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          sha256sum "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: math-run-android-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
