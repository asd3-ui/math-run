<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2b40"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- road -->
  <path d="M128 512 L192 200 L320 200 L384 512 Z" fill="url(#road)"/>
  <!-- lane lines -->
  <rect x="248" y="230" width="16" height="60" rx="6" fill="#fff" opacity="0.85"/>
  <rect x="248" y="320" width="16" height="60" rx="6" fill="#fff" opacity="0.85"/>
  <rect x="248" y="410" width="16" height="60" rx="6" fill="#fff" opacity="0.85"/>
  <!-- runner head -->
  <circle cx="256" cy="150" r="46" fill="#ffdbac"/>
  <!-- runner body -->
  <rect x="236" y="185" width="40" height="70" rx="20" fill="#ff6b6b"/>
  <!-- arms -->
  <rect x="196" y="200" width="24" height="56" rx="12" fill="#ff6b6b" transform="rotate(-25 208 228)"/>
  <rect x="292" y="200" width="24" height="56" rx="12" fill="#ff6b6b" transform="rotate(25 304 228)"/>
  <!-- math symbols floating -->
  <text x="86" y="150" font-family="Arial" font-weight="bold" font-size="72" fill="#fff" opacity="0.9">+</text>
  <text x="400" y="150" font-family="Arial" font-weight="bold" font-size="72" fill="#fff" opacity="0.9">×</text>
  <text x="70" y="270" font-family="Arial" font-weight="bold" font-size="60" fill="#fbbf24" opacity="0.9">=</text>
</svg>
